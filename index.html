<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Portfolio</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav id="navbar">
    <div class="logo">Uday</div>
    <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>

<section id="home">
    <h1>Hi, I'm <span id="my-name">Uday</span></h1>
    <p>Full Stack Developer | Java | Spring Boot</p>
</section>

<section id="about">
    <h2>About Me</h2>
    <p>I am a passionate developer who loves building web applications.</p>
</section>

<section id="projects">
    <h2>Projects</h2>
    <div id="projects-container"></div>
</section>

<section id="contact">
    <h2>Contact Me</h2>
    <div class="contact-form">
        <input type="text" id="name" placeholder="Your Name" />
        <input type="email" id="email" placeholder="Your Email" />
        <textarea id="message" placeholder="Your Message"></textarea>
        <button id="submit-btn">Send Message</button>
    </div>
</section>

<script src="js/main.js"></script>
</body>
</html>
